# Unity CI: quick regression + EditMode NUnit + Windows x64 build.
#
# Runs-on is Windows on purpose: the Windows editor ships the Windows Mono
# player support, while a Linux runner would need the windows-il2cpp module and
# this project builds the default Mono player.
#
# Required repository secret, one of the two (Settings -> Secrets and variables
# -> Actions). "Check required secrets" fails with an explicit message when both
# are missing, instead of silently skipping the Unity work.
#   UNITY_LICENSE_SERIAL          Unity Editor serial (Plus / Pro / Enterprise).
#   UNITY_LICENSE_FILE_BASE64     An offline .ulf license file, base64 encoded.
#
# Unity Personal cannot be activated headlessly on a hosted runner: Unity's
# licensing backend rejects service-account tokens for Personal activation.
# Options, in order of preference: (1) use a paid serial above; (2) run this job
# on a self-hosted runner whose Hub is already signed in with the Personal
# license (change "runs-on" and set UNITY_SKIP_LICENSE_ACTIVATION: '1');
# (3) a floating license server. See README "Build and CI".
#
# Optional Unity Cloud service-account secrets (only needed for Unity services,
# not for the local test/build steps):
#   UNITY_SERVICE_ACCOUNT_ID
#   UNITY_SERVICE_ACCOUNT_SECRET

name: Unity CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: unity-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh
        working-directory: HelloWorldProject

    env:
      UNITY_SERVICE_ACCOUNT_ID: ${{ secrets.UNITY_SERVICE_ACCOUNT_ID }}
      UNITY_SERVICE_ACCOUNT_SECRET: ${{ secrets.UNITY_SERVICE_ACCOUNT_SECRET }}
      UNITY_LICENSE_SERIAL: ${{ secrets.UNITY_LICENSE_SERIAL }}
      UNITY_LICENSE_FILE_BASE64: ${{ secrets.UNITY_LICENSE_FILE_BASE64 }}
      UNITY_SKIP_LICENSE_ACTIVATION: ${{ vars.UNITY_SKIP_LICENSE_ACTIVATION }}
      UNITY_FORMAT: github
      UNITY_NON_INTERACTIVE: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        working-directory: .
        run: |
          if ($env:UNITY_SKIP_LICENSE_ACTIVATION -eq '1') {
            Write-Host "License activation skipped (self-hosted runner with a signed-in Hub)."
          }
          elseif (-not $env:UNITY_LICENSE_SERIAL -and -not $env:UNITY_LICENSE_FILE_BASE64) {
            throw "Missing a Unity license secret: set UNITY_LICENSE_SERIAL (paid serial) or UNITY_LICENSE_FILE_BASE64 (offline .ulf, base64). Unity Personal cannot be activated headlessly on a hosted runner - see README 'Build and CI'."
          }
          if ($env:UNITY_LICENSE_FILE_BASE64) {
            Write-Host "::add-mask::$env:UNITY_LICENSE_FILE_BASE64"
          }

      - name: Install Unity CLI
        working-directory: .
        run: |
          irm https://unity.com/install.ps1 | iex
          "$env:LOCALAPPDATA\Unity\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Resolve Unity download cache
        id: unity-cache
        working-directory: .
        run: |
          $info = unity cache info --format json | ConvertFrom-Json
          "path=$($info.data.path)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Restore Unity download cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.unity-cache.outputs.path }}
          key: unity-downloads-6000.6.5f1

      - name: Compute Library cache key
        id: cache-key
        run: |
          $key = unity cache key --target StandaloneWindows64
          "key=$key" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Restore project Library
        uses: actions/cache@v4
        with:
          path: HelloWorldProject/Library
          key: unity-library-${{ steps.cache-key.outputs.key }}

      - name: Install Unity Editor
        working-directory: .
        run: unity install 6000.6.5f1 --yes --accept-eula

      - name: Activate Unity license
        if: env.UNITY_SKIP_LICENSE_ACTIVATION != '1'
        working-directory: .
        run: |
          if ($env:UNITY_LICENSE_SERIAL) {
            unity license activate --serial "$env:UNITY_LICENSE_SERIAL"
          }
          else {
            $ulf = Join-Path $env:RUNNER_TEMP 'unity.ulf'
            [System.IO.File]::WriteAllBytes($ulf, [System.Convert]::FromBase64String($env:UNITY_LICENSE_FILE_BASE64))
            unity license activate --file $ulf
          }

      - name: Preflight
        run: unity doctor --ci

      - name: Quick regression
        run: unity run -- -executeMethod AutoBattle.EditorTools.QuickRegression.RunAllQuickBatch

      - name: EditMode tests
        run: unity test --mode EditMode --report-format junit --output test-results.xml

      - name: Build Windows x64
        run: unity build --target StandaloneWindows64 --output-path Build/Windows/AutoBattle.exe

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editmode-test-results
          path: HelloWorldProject/test-results.xml
          if-no-files-found: warn

      - name: Upload Windows build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AutoBattle-Windows-x64
          path: HelloWorldProject/Build/Windows/
          if-no-files-found: error

      - name: Return Unity license
        if: always() && env.UNITY_SKIP_LICENSE_ACTIVATION != '1' && (env.UNITY_LICENSE_SERIAL != '' || env.UNITY_LICENSE_FILE_BASE64 != '')
        working-directory: .
        run: unity license return --yes
